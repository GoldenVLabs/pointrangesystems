<g><rect x="404" y="372" width="372" height="158" rx="14" fill="#FFFFFF" stroke="#D3E6EE" stroke-width="2"/><rect x="404" y="372" width="8" height="158" rx="4" fill="#00B2D4"/><circle cx="440" cy="404" r="16" fill="#00B2D4"/><text x="440" y="411" font-family="Manrope, Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="440" dy="0">3</tspan></text><text x="466" y="411" font-family="Manrope, Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="23" font-weight="800" fill="#002038" text-anchor="start"><tspan x="466" dy="0">Turned into a level</tspan></text><text x="426" y="442" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18.5" font-weight="400" fill="#1E3A4C" text-anchor="start"><tspan x="426" dy="0">Pressure is converted to water depth,</tspan><tspan x="426" dy="24.1">then percent full and gallons for</tspan><tspan x="426" dy="24.1">your tank. Drop below your low line</tspan><tspan x="426" dy="24.1">and you get an alert.</tspan></text></g>
