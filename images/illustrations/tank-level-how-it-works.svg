<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 918" width="800" height="918" role="img" aria-labelledby="tank-title tank-desc">
<title id="tank-title">How a tank level pressure probe works</title>
<desc id="tank-desc">Cutaway of a water tank: a submersible pressure probe rests on the bottom of the tank on its cable. The water above the probe presses down on it, so more water means more pressure. That pressure is converted to water depth, then percent full and gallons for the tank's size. A sensor node outside the tank sends readings over LoRaWAN radio to a gateway, then to a dashboard, with a phone alert when the level drops below a low line.</desc>
<rect width="800" height="918" rx="24" fill="#F4FAFC"/>
<text x="40" y="58" font-family="Manrope, Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="31" font-weight="800" fill="#002038" text-anchor="start"><tspan x="40" dy="0">How a pressure probe reads tank level</tspan></text>
<text x="40" y="92" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#4A6272" text-anchor="start"><tspan x="40" dy="0">A small probe on the tank floor feels the weight of the water.</tspan></text>
